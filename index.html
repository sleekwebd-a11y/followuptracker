<aside class="sidebar">
  <div class="brand-card compact-brand">
    <div class="brand-row">
      <div>
        <span class="eyebrow">Lead tracker</span>
        <h1>Pipeline</h1>
      </div>
      <div class="brand-dot"></div>
    </div>
  </div>

  <div class="sidebar-card">
    <div class="section-top">
      <div>
        <span class="eyebrow">Filters</span>
        <h2>View leads</h2>
      </div>
    </div>

    <div class="filter-stack">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="today">Due today</button>
      <button class="filter-btn" data-filter="overdue">Overdue</button>
      <button class="filter-btn" data-filter="waiting">Waiting</button>
      <button class="filter-btn" data-filter="won">Won</button>
      <button class="filter-btn" data-filter="lost">Lost</button>
    </div>
  </div>

  <div class="sidebar-card">
    <div class="section-top">
      <div>
        <span class="eyebrow">Quick stats</span>
        <h2>Pipeline snapshot</h2>
      </div>
    </div>

    <div class="mini-stats">
      <div class="mini-stat">
        <span>Total leads</span>
        <strong id="statTotal">0</strong>
      </div>
      <div class="mini-stat">
        <span>Due today</span>
        <strong id="statToday">0</strong>
      </div>
      <div class="mini-stat">
        <span>Overdue</span>
        <strong id="statOverdue">0</strong>
      </div>
      <div class="mini-stat">
        <span>Won</span>
        <strong id="statWon">0</strong>
      </div>
    </div>
  </div>
</aside>
